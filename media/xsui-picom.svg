<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <!-- Main Aero glass gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e9f8ff"/>
      <stop offset="8%"   stop-color="#8fdcff"/>
      <stop offset="28%"  stop-color="#319be8"/>
      <stop offset="55%"  stop-color="#0875c8"/>
      <stop offset="78%"  stop-color="#075da8"/>
      <stop offset="100%" stop-color="#033c7b"/>
    </linearGradient>

    <!-- Inner glass -->
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#001f4f" stop-opacity=".20"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="32%"  stop-color="#eaf8ff"/>
      <stop offset="52%"  stop-color="#8ed8ff"/>
      <stop offset="100%" stop-color="#2c82c5"/>
    </linearGradient>

    <!-- Text bevel -->
    <linearGradient id="textEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#07518f"/>
    </linearGradient>

    <!-- Shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Subtle text shadow -->
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="6" result="offset"/>
      <feFlood flood-color="#002c5c" flood-opacity=".75"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="iconClip">
      <rect x="42" y="42" width="428" height="428" rx="92"/>
    </clipPath>
  </defs>

  <!-- Floating shadow -->
  <rect x="48" y="58"
        width="416" height="416"
        rx="92"
        fill="#001d42"
        opacity=".55"
        filter="url(#shadow)"/>

  <!-- Main icon -->
  <rect x="42" y="42"
        width="428" height="428"
        rx="92"
        fill="url(#bg)"
        stroke="#bcecff"
        stroke-width="5"/>

  <!-- Glass interior -->
  <rect x="50" y="50"
        width="412" height="412"
        rx="84"
        fill="url(#inner)"
        stroke="#004c91"
        stroke-width="3"/>

  <!-- Upper Aero glass reflection -->
  <path d="
    M 55 132
    Q 55 55 132 55
    L 380 55
    Q 457 55 457 132
    L 457 185
    Q 350 145 256 158
    Q 150 173 55 140
    Z"
    fill="url(#shine)"
    clip-path="url(#iconClip)"/>

  <!-- Thin inner highlight -->
  <rect x="58" y="58"
        width="396" height="396"
        rx="78"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".42"
        stroke-width="3"/>

  <!-- Bottom blue depth -->
  <path d="
    M 55 370
    Q 160 410 256 397
    Q 355 384 457 425
    L 457 462
    L 55 462 Z"
    fill="#003e78"
    opacity=".22"
    clip-path="url(#iconClip)"/>

  <!-- Glow behind lettering -->
  <text x="256"
        y="314"
        text-anchor="middle"
        font-family="Lucida Grande, Helvetica Neue, Arial, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="-6"
        fill="#ffffff"
        opacity=".25"
        filter="url(#glow)">XSUI</text>

  <!-- Text dark bevel -->
  <text x="256"
        y="314"
        text-anchor="middle"
        font-family="Lucida Grande, Helvetica Neue, Arial, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="-6"
        fill="url(#textEdge)"
        stroke="#003c70"
        stroke-width="9"
        stroke-linejoin="round"
        opacity=".95"
        filter="url(#textShadow)">XSUI</text>

  <!-- Main lettering -->
  <text x="256"
        y="306"
        text-anchor="middle"
        font-family="Lucida Grande, Helvetica Neue, Arial, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="-6"
        fill="url(#text)"
        stroke="#ffffff"
        stroke-opacity=".55"
        stroke-width="2">XSUI</text>

  <!-- Letter top shine -->
  <text x="256"
        y="300"
        text-anchor="middle"
        font-family="Lucida Grande, Helvetica Neue, Arial, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="-6"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".55"
        stroke-width="2">XSUI</text>

  <!-- Small glass highlight -->
  <path d="
    M 116 91
    Q 256 61 396 91
    Q 421 97 430 119
    Q 310 99 256 106
    Q 184 114 82 135
    Q 88 101 116 91
    Z"
    fill="#ffffff"
    opacity=".16"
    clip-path="url(#iconClip)"/>

</svg>